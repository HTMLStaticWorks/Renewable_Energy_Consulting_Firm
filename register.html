<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aethera Portal | Create Account</title>
  
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  
  <!-- Custom Style Sheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body>

  <!-- Floating Utility Buttons Top Right -->
  <div class="position-absolute top-0 end-0 p-2 z-3 d-flex gap-2">
    <button class="utility-btn rtl-toggle-btn" aria-label="Toggle Document Direction" title="Toggle RTL/LTR">
      <span class="rtl-toggle-text">RTL</span>
    </button>
    <button class="utility-btn theme-toggle-btn" aria-label="Toggle Light/Dark Theme" title="Toggle Dark Mode">
      <span class="theme-icon"></span>
    </button>
  </div>

  <div class="auth-wrapper py-5" style="min-height: 110vh;">
    <div class="auth-card reveal-fade-up active">
      
      <!-- Brand Logo inside card -->
      <div class="text-center mb-4">
        <a href="index.html" class="navbar-brand-logo justify-content-center mb-2">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L22 12L12 22L2 12L12 2Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M12 6V18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M8 12H16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
          <span style="font-size: 1.5rem; letter-spacing: -0.02em;">AETHERA</span>
        </a>
        <p class="small text-muted mb-0">Create Advisory Portal Account</p>
      </div>

      <!-- Auth Form -->
      <form class="no-ajax" action="login.html" method="GET">
        
        <!-- Name -->
        <div class="row g-2 mb-3">
          <div class="col-6">
            <div class="form-floating">
              <input type="text" class="form-control" id="registerFirst" placeholder="John" required>
              <label for="registerFirst">First Name</label>
            </div>
          </div>
          <div class="col-6">
            <div class="form-floating">
              <input type="text" class="form-control" id="registerLast" placeholder="Doe" required>
              <label for="registerLast">Last Name</label>
            </div>
          </div>
        </div>

        <!-- Email -->
        <div class="form-floating mb-3">
          <input type="email" class="form-control" id="registerEmail" placeholder="name@company.com" required>
          <label for="registerEmail">Email address</label>
        </div>

        <!-- Password -->
        <div class="password-toggle-wrapper form-floating mb-3">
          <input type="password" class="form-control" id="registerPassword" placeholder="Password" required>
          <label for="registerPassword">Password</label>
          <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>

        <!-- Confirm Password -->
        <div class="password-toggle-wrapper form-floating mb-3">
          <input type="password" class="form-control" id="registerConfirm" placeholder="Confirm Password" required>
          <label for="registerConfirm">Confirm Password</label>
          <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-premium-primary w-100 py-3 mb-4 justify-content-center">
          <span>Create Account</span>
        </button>

        <!-- Separator -->
        <div class="d-flex align-items-center my-3 text-muted">
          <hr class="flex-grow-1 my-0">
          <span class="px-3 small">or join with</span>
          <hr class="flex-grow-1 my-0">
        </div>

        <!-- Social Integrations -->
        <button type="button" class="social-auth-btn" onclick="location.href='login.html'">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M12.24 10.285V13.4h6.887C18.2 15.614 15.645 18 12.24 18c-3.86 0-7-3.14-7-7s3.14-7 7-7c1.7 0 3.3.6 4.5 1.7l2.4-2.4C17.3 1.5 14.9 0 12.24 0 6.03 0 1 5.03 1 11.24s5.03 11.24 11.24 11.24c6.1 0 11.24-4.4 11.24-11.24 0-.76-.07-1.5-.2-2.22l-10.04-.03z"/></svg>
          <span>Sign up with Google</span>
        </button>
        <button type="button" class="social-auth-btn" onclick="location.href='login.html'">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.17c.66-.81 1.11-1.93.99-3.06-.96.04-2.13.64-2.82 1.45-.6.69-1.12 1.84-.98 2.94.1.08 2.15-.52 2.81-1.33z"/></svg>
          <span>Sign up with Apple</span>
        </button>

        <!-- Redirect Link -->
        <p class="text-center small text-muted mt-4 mb-0">
          Already have an account? <a href="login.html" class="text-primary fw-bold">Sign In</a>
        </p>
      </form>

    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  
  <!-- Custom Logic -->
  <script src="assets/js/main.js"></script>
</body>
</html>
