<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aethera | Portal Expansion Launching Soon</title>
  
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  
  <!-- Custom Style Sheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body>

  <!-- Floating Utility Controls Top Right -->
  <div class="position-absolute top-0 end-0 p-4 z-3 d-flex gap-2">
    <button class="utility-btn rtl-toggle-btn" aria-label="Toggle Document Direction" title="Toggle RTL/LTR">
      <span class="rtl-toggle-text">RTL</span>
    </button>
    <button class="utility-btn theme-toggle-btn" aria-label="Toggle Light/Dark Theme" title="Toggle Dark Mode">
      <span class="theme-icon"></span>
    </button>
  </div>

  <div class="fullscreen-center-section" style="min-height: 100vh; padding: 4rem 1rem;">
    <div class="reveal-fade-up active">
      
      <!-- Brand Logo -->
      <a href="index.html" class="navbar-brand-logo justify-content-center mb-4">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L22 12L12 22L2 12L12 2Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M12 6V18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M8 12H16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span style="font-size: 1.5rem; letter-spacing: -0.02em;">AETHERA</span>
      </a>

      <h1 class="text-display-1 fw-bold text-secondary mb-3" style="font-size: clamp(2.2rem, 5vw, 3.8rem);">Portal Expansion Launching</h1>
      <p class="lead text-muted max-width-600 mx-auto mb-5">We are digitalizing our senior engineering audit tools and feasibility modeling algorithms directly into a client dashboard portal. Launch coordinates mapped below.</p>

      <!-- Countdown Wrapper (Targeted by JS timer) -->
      <div class="d-flex justify-content-center gap-2 gap-sm-3 mb-5">
        <div class="countdown-box">
          <div class="countdown-number" id="days">90</div>
          <div class="countdown-label">Days</div>
        </div>
        <div class="countdown-box">
          <div class="countdown-number" id="hours">00</div>
          <div class="countdown-label">Hrs</div>
        </div>
        <div class="countdown-box">
          <div class="countdown-number" id="minutes">00</div>
          <div class="countdown-label">Mins</div>
        </div>
        <div class="countdown-box">
          <div class="countdown-number" id="seconds">00</div>
          <div class="countdown-label">Secs</div>
        </div>
      </div>

      <!-- Newsletter sign up -->
      <div class="max-width-500 mx-auto">
        <h5 class="fw-bold mb-3 small text-uppercase tracking-wider text-secondary">Notify Me on Expansion Launch</h5>
        <form>
          <div class="input-group">
            <div class="form-floating flex-grow-1">
              <input type="email" class="form-control" id="launchEmail" placeholder="name@company.com" style="border-top-right-radius: 0; border-bottom-right-radius: 0;" required>
              <label for="launchEmail">Email address</label>
            </div>
            <button type="submit" class="btn-premium-primary" style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
              <span>Submit</span>
            </button>
          </div>
        </form>
      </div>

    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  
  <!-- Custom Logic -->
  <script src="assets/js/main.js"></script>
  <!-- Scroll to Top Button -->
  <button id="scrollTopBtn" class="scroll-top-btn" aria-label="Scroll to Top" title="Scroll to Top">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>
</body>
</html>
