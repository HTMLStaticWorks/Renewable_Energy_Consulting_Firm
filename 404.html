<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aethera | 404 - Lost in the Grid</title>
  
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  
  <!-- Custom Style Sheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body>

  <!-- Floating Utility Controls Top Right -->
  <div class="position-absolute top-0 end-0 p-4 z-3 d-flex gap-2">
    <button class="utility-btn rtl-toggle-btn" aria-label="Toggle Document Direction" title="Toggle RTL/LTR">
      <span class="rtl-toggle-text">RTL</span>
    </button>
    <button class="utility-btn theme-toggle-btn" aria-label="Toggle Light/Dark Theme" title="Toggle Dark Mode">
      <span class="theme-icon"></span>
    </button>
  </div>

  <div class="fullscreen-center-section">
    <div class="reveal-fade-up active">
      
      <!-- Energy flow visual representation -->
      <div class="grid-energy-flow-visual mx-auto">
        <!-- Center Broken Node -->
        <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-primary" style="animation: spinPulse 4s linear infinite;">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          <line x1="6" y1="6" x2="18" y2="18" stroke="var(--color-accent)" stroke-width="2.5" stroke-dasharray="3 3"/>
        </svg>
      </div>

      <h1 class="text-display-1 fw-bold text-secondary mb-3" style="font-size: 3rem;">Lost in the Energy Grid?</h1>
      <p class="lead text-muted max-width-600 mx-auto mb-5">The node you are requesting is offline or has been routed to a different clean energy sector. Let's redirect you back to primary coordinates.</p>
      
      <a href="index.html" class="btn-premium-primary px-5 py-3">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>Return Home</span>
      </a>
    </div>
  </div>

  <!-- CSS override for broken node animation -->
  <style>
    @keyframes spinPulse {
      0% { transform: scale(1) rotate(0deg); opacity: 0.9; }
      50% { transform: scale(1.1) rotate(180deg); opacity: 0.6; }
      100% { transform: scale(1) rotate(360deg); opacity: 0.9; }
    }
  </style>

  <!-- Bootstrap 5 JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  
  <!-- Custom Logic -->
  <script src="assets/js/main.js"></script>
  <!-- Scroll to Top Button -->
  <button id="scrollTopBtn" class="scroll-top-btn" aria-label="Scroll to Top" title="Scroll to Top">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>
</body>
</html>
